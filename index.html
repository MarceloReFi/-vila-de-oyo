<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vila de Oyó — Hermes (design reference)</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Fira+Sans:wght@400;500;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  body{margin:0;padding:0;background:#131313;font-family:'Fira Sans',sans-serif;color:#e5e2e1;}
  *{box-sizing:border-box;}
  a{color:#fbb796;}
  a:hover{color:#ffe16d;}
  .screen{position:absolute;inset:0;display:none;}
  .screen.active{display:block;}
  #root{position:relative;width:100vw;height:100vh;overflow:hidden;}
  @keyframes flicker{0%{opacity:1;transform:scale(1);}25%{opacity:.8;transform:scale(1.05);}50%{opacity:.9;transform:scale(.95);}75%{opacity:.7;transform:scale(1.02);}100%{opacity:1;transform:scale(1);}}
  @keyframes typing{from{width:0}to{width:100%}}
  @keyframes markerPulse{0%,100%{transform:translate(-50%,-50%) rotate(45deg) scale(1);}50%{transform:translate(-50%,-50%) rotate(45deg) scale(1.25);}}
  @keyframes toastIn{from{opacity:0;transform:translate(-50%,10px);}to{opacity:1;transform:translate(-50%,0);}}
  @keyframes pulseOpacity{0%,100%{opacity:1;}50%{opacity:.25;}}
  @keyframes spark1{to{transform:translate(-70px,-50px) scale(0);opacity:0;}}
  @keyframes spark2{to{transform:translate(60px,-55px) scale(0);opacity:0;}}
  @keyframes spark3{to{transform:translate(-40px,20px) scale(0);opacity:0;}}
  @keyframes spark4{to{transform:translate(50px,25px) scale(0);opacity:0;}}
  @keyframes spark5{to{transform:translate(-15px,-75px) scale(0);opacity:0;}}
  @keyframes spark6{to{transform:translate(20px,-80px) scale(0);opacity:0;}}
  .marker{position:absolute;transform:translate(-50%,-50%);background:none;border:none;padding:0;cursor:pointer;}
  .marker .dot{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotate(45deg);width:18px;height:18px;border:2px solid #0e0e0e;box-shadow:2px 2px 0 rgba(0,0,0,.8);animation:markerPulse 1.6s ease-in-out infinite;}
  .marker .tooltip{position:absolute;bottom:28px;left:50%;transform:translateX(-50%);background:#0e0e0e;padding:8px 12px;white-space:nowrap;box-shadow:3px 3px 0 rgba(0,0,0,.8);display:none;}
  .marker:hover .tooltip{display:block;}
  .tooltip .tt-name{font-family:'Space Mono',monospace;font-size:13px;font-weight:700;color:#fff9ef;text-transform:uppercase;}
  .tooltip .tt-sub{font-family:'JetBrains Mono',monospace;font-size:11px;color:#d6c2ba;margin-top:2px;}
  .toast{position:fixed;bottom:40px;left:50%;transform:translateX(-50%);background:#0e0e0e;border:3px solid #52443d;padding:12px 20px;font-family:'Fira Sans',sans-serif;font-size:14px;color:#ffe16d;box-shadow:4px 4px 0 rgba(0,0,0,.8);animation:toastIn .25s ease-out;z-index:50;display:none;}
  .action-btn{display:flex;align-items:center;gap:16px;padding:16px;text-align:left;border:2px solid #52443d;background:#20201f;box-shadow:inset 2px 2px 0 rgba(255,255,255,.1),inset -2px -2px 0 rgba(0,0,0,.5),4px 4px 0 rgba(0,0,0,.8);cursor:pointer;}
  .action-btn.active{border-color:#ff636f;background:rgba(255,99,111,0.12);}
  .action-btn .icon-box{width:64px;height:64px;background:#353535;border:2px solid #52443d;display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:inset 2px 2px 0 rgba(0,0,0,.5);}
  .action-btn.active .icon-box{border-color:#ff636f;}
  .action-btn h3{font-family:'Space Mono',monospace;font-size:18px;font-weight:700;color:#e5e2e1;margin:0;}
  .action-btn.active h3{color:#ff636f;}
  .action-btn p{font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:500;color:#d6c2ba;margin:4px 0 0;}
  .spark{position:absolute;top:70px;right:70px;border-radius:50%;}
  .particles{position:absolute;inset:0;pointer-events:none;z-index:20;overflow:hidden;display:none;}
  .particles.show .spark{animation-play-state:running;}
</style>
</head>
<body>
<div id="root">

  <div class="screen active" id="screen-gate">
    <div style="position:absolute;inset:0;background-image:url('https://lh3.googleusercontent.com/aida-public/AB6AXuBM7jGZufsioI2glugx4rOEwQ0JtEtW5NuBDWWpkkitg-ZKL9e-uHeaCwH-jNWxS1vh_cILC79p_mj80uQ8O9ObpmwTwgLug0mltxP7CeAIbOSM4mXRLF6FCilTRGWUvsTlbJC-UnJfGNUzVKPKBUBJjsf2i-78oVHzUuk67rtKfs9l8WwHJ7GcX0jHe7zsqfl68FNiDYlsNbSPgGmayRuU5bxDlUwu8AlGyv-0fF6JZ2mDZZqmlPd6');background-size:cover;background-position:center;opacity:.6;"></div>
    <div style="position:absolute;inset:0;background:rgba(0,0,0,.45);"></div>
    <div style="position:absolute;width:200px;height:200px;top:28%;left:18%;border-radius:50%;background:radial-gradient(circle,rgba(251,183,150,.4) 0%,rgba(251,183,150,0) 70%);mix-blend-mode:screen;pointer-events:none;animation:flicker .5s infinite alternate;"></div>
    <div style="position:absolute;width:200px;height:200px;top:28%;right:18%;border-radius:50%;background:radial-gradient(circle,rgba(251,183,150,.4) 0%,rgba(251,183,150,0) 70%);mix-blend-mode:screen;pointer-events:none;animation:flicker .5s infinite alternate;"></div>
    <div style="position:relative;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;padding:24px;">
      <div style="position:relative;margin-bottom:48px;text-align:center;">
        <div style="position:absolute;inset:0;background:#855237;transform:skewX(-6deg) scale(1.1);box-shadow:8px 8px 0 #000;z-index:-1;border:2px solid #0e0e0e;"></div>
        <h1 style="font-family:'Space Mono',monospace;font-size:48px;font-weight:700;letter-spacing:-1px;color:#ffe16d;text-transform:uppercase;text-shadow:4px 4px 0 #000;position:relative;z-index:10;padding:16px 40px;margin:0;">Vila de Oyó</h1>
      </div>
      <div style="width:100%;max-width:420px;padding:32px;border-radius:8px;background:#2a2a2a;border-top:2px solid #9f8d85;border-left:2px solid #9f8d85;border-bottom:2px solid #0e0e0e;border-right:2px solid #0e0e0e;box-shadow:inset 0 0 16px rgba(0,0,0,.8),8px 8px 0 #000;display:flex;flex-direction:column;gap:24px;">
        <div style="display:flex;flex-direction:column;gap:8px;">
          <label style="font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:500;color:#d6c2ba;text-transform:uppercase;letter-spacing:2px;">Nome de Usuário</label>
          <input placeholder="Digite seu nome" style="width:100%;padding:14px;font-family:'Fira Sans',sans-serif;font-size:16px;background:#fff9ef;color:#4e250e;border:2px solid #0e0e0e;box-shadow:inset 4px 4px 0 rgba(0,0,0,.25);border-radius:2px;">
        </div>
        <div style="display:flex;flex-direction:column;gap:8px;">
          <label style="font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:500;color:#d6c2ba;text-transform:uppercase;letter-spacing:2px;">Senha Secreta</label>
          <input placeholder="••••••••" type="password" style="width:100%;padding:14px;font-family:'Fira Sans',sans-serif;font-size:16px;background:#fff9ef;color:#4e250e;border:2px solid #0e0e0e;box-shadow:inset 4px 4px 0 rgba(0,0,0,.25);border-radius:2px;">
        </div>
        <button id="btn-enter" style="width:100%;padding:16px;margin-top:4px;background:#c78a6b;color:#4e250d;border-top:2px solid #ffdbcb;border-left:2px solid #ffdbcb;border-bottom:4px solid #693b22;border-right:4px solid #693b22;font-family:'Space Mono',monospace;font-size:18px;font-weight:700;text-transform:uppercase;cursor:pointer;">Entrar</button>
        <div style="text-align:center;margin-top:2px;">
          <a href="#" style="font-family:'JetBrains Mono',monospace;font-size:12px;text-decoration:underline dotted;">Esqueceu os búzios? (Recuperar Senha)</a>
        </div>
      </div>
    </div>
  </div>

  <div class="screen" id="screen-map">
    <!-- placeholder: swap for the "Vista da Vila" isometric village art (see design/vista-da-vila.png in this Claude project) -->
    <div style="position:absolute;inset:0;background:radial-gradient(circle at 50% 60%,#3a2e22,#1a1512 70%);"></div>
    <div style="position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.4) 100%);pointer-events:none;"></div>
    <div style="position:absolute;top:16px;left:16px;background:rgba(14,14,14,.75);border:2px solid #52443d;padding:6px 14px;font-family:'Space Mono',monospace;font-size:14px;font-weight:700;color:#fbb796;text-transform:uppercase;letter-spacing:1px;box-shadow:3px 3px 0 rgba(0,0,0,.6);">Vila de Oyó</div>
    <div style="position:absolute;bottom:20px;left:50%;transform:translateX(-50%);background:rgba(14,14,14,.7);border:2px solid #52443d;padding:8px 18px;font-family:'Fira Sans',sans-serif;font-size:14px;color:#e5e2e1;white-space:nowrap;">Toque em uma construção para entrar</div>

    <button class="marker" data-building="forge" data-built="1" style="left:15%;top:50%;">
      <div class="dot" style="background:#ff8a4c;box-shadow:0 0 12px #ff8a4c,2px 2px 0 rgba(0,0,0,.8);"></div>
      <div class="tooltip" style="border:2px solid #ff8a4c;"><div class="tt-name">Ferraria de Ogum</div><div class="tt-sub">Ogum · GitHub</div></div>
    </button>
    <button class="marker" data-building="palace" data-built="0" style="left:49%;top:16%;">
      <div class="dot" style="background:#ffe16d;box-shadow:0 0 12px #ffe16d,2px 2px 0 rgba(0,0,0,.8);"></div>
      <div class="tooltip" style="border:2px solid #ffe16d;"><div class="tt-name">Palácio do Alaafin</div><div class="tt-sub">Xangô · Painel do Reino</div></div>
    </button>
    <button class="marker" data-building="grove" data-built="0" style="left:80%;top:47%;">
      <div class="dot" style="background:#c8a2c8;box-shadow:0 0 12px #c8a2c8,2px 2px 0 rgba(0,0,0,.8);"></div>
      <div class="tooltip" style="border:2px solid #c8a2c8;"><div class="tt-name">Bosque de Nanã</div><div class="tt-sub">Nanã · Obsidian</div></div>
    </button>
    <button class="marker" data-building="market" data-built="0" style="left:50%;top:75%;">
      <div class="dot" style="background:#ff6b6b;box-shadow:0 0 12px #ff6b6b,2px 2px 0 rgba(0,0,0,.8);"></div>
      <div class="tooltip" style="border:2px solid #ff6b6b;"><div class="tt-name">Mercado de Exu</div><div class="tt-sub">Exu · Telegram</div></div>
    </button>

    <div class="toast" id="toast"></div>
  </div>

  <div class="screen" id="screen-forge">
    <div style="position:absolute;inset:0;background-image:url('https://lh3.googleusercontent.com/aida-public/AB6AXuDvqtV88WM0yCIym9y--l6IZ3RQw0qbklJI0u3X4FynwViNl7hXUummxd_NIuwbR-tJqXo8IbGwQ0xB30_vxEkWIKcmfjx--vGYjRocEwYpnE0L3EGH5VwBE5XsTj7gsaI-g6Vpum1GGxdsb3pkHf6WQrhp-8125WRC7TlN-daXq5Jg6bXXPjTXQs6ahtd66utNt8mkcHgZ0Wxsj-TACp2sssEz3xAvnjwSWeNJc2ZiapbSsfOw4-4E');background-size:cover;background-position:center;filter:blur(4px);opacity:.55;"></div>
    <div style="position:absolute;inset:0;background:rgba(19,19,19,.55);"></div>
    <button id="btn-back" style="position:absolute;top:20px;left:20px;z-index:20;background:rgba(14,14,14,.8);border:2px solid #52443d;padding:8px 16px;font-family:'Space Mono',monospace;font-size:13px;font-weight:700;color:#fbb796;text-transform:uppercase;cursor:pointer;">‹ Vila</button>
    <div style="position:relative;z-index:10;display:flex;align-items:center;justify-content:center;height:100%;padding:24px;">
      <div style="position:relative;width:100%;max-width:800px;background:#2a2a2a;border:4px solid #2a1f1a;box-shadow:inset 2px 2px 0 #fbb796,inset -2px -2px 0 #0e0e0e,0 0 30px rgba(251,183,150,.3),8px 8px 0 #000;padding:24px;display:flex;flex-direction:column;gap:24px;">
        <header style="display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #52443d;padding-bottom:16px;">
          <div>
            <h1 style="font-family:'Space Mono',monospace;font-size:32px;font-weight:700;letter-spacing:-.5px;color:#fbb796;margin:0;">FERRARIA DE OGUM</h1>
            <div style="font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:500;color:#ff636f;text-transform:uppercase;letter-spacing:2px;margin-top:4px;">Status: O fogo está aceso</div>
          </div>
          <div style="width:48px;height:48px;background:#353535;border:2px solid #52443d;display:flex;align-items:center;justify-content:center;box-shadow:inset 2px 2px 0 rgba(0,0,0,.5);flex-shrink:0;">
            <div style="position:relative;width:24px;height:24px;">
              <div style="position:absolute;bottom:0;left:4px;width:16px;height:17px;background:#920023;clip-path:polygon(50% 0%,80% 30%,90% 70%,50% 100%,10% 70%,20% 30%);"></div>
              <div style="position:absolute;bottom:2px;left:7px;width:10px;height:11px;background:#ffb347;clip-path:polygon(50% 0%,80% 35%,65% 100%,35% 100%,20% 35%);"></div>
            </div>
          </div>
        </header>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;" id="actions">
          <button class="action-btn active" data-action="0">
            <div class="icon-box"><div style="position:relative;width:40px;height:40px;">
              <div style="position:absolute;top:2px;left:6px;width:28px;height:14px;background:#2a2a2a;border:2px solid #0e0e0e;box-shadow:inset 2px 2px 0 rgba(255,255,255,.15);"></div>
              <div style="position:absolute;top:14px;left:17px;width:8px;height:24px;background:#c78a6b;border:2px solid #4e250d;"></div>
            </div></div>
            <div><h3>Temperar novo commit</h3><p>git commit</p></div>
          </button>
          <button class="action-btn" data-action="1">
            <div class="icon-box"><div style="position:relative;width:40px;height:40px;">
              <div style="position:absolute;bottom:0;left:8px;width:24px;height:26px;background:#920023;clip-path:polygon(50% 0%,80% 30%,90% 70%,50% 100%,10% 70%,20% 30%);"></div>
              <div style="position:absolute;bottom:4px;left:13px;width:14px;height:16px;background:#ffb347;clip-path:polygon(50% 0%,80% 35%,65% 100%,35% 100%,20% 35%);"></div>
            </div></div>
            <div><h3>Soprar o fole</h3><p>git sync</p></div>
          </button>
          <button class="action-btn" data-action="2">
            <div class="icon-box"><div style="position:relative;width:40px;height:40px;">
              <div style="position:absolute;top:18px;left:18px;width:4px;height:4px;background:#0e0e0e;border-radius:50%;z-index:2;"></div>
              <div style="position:absolute;top:6px;left:4px;width:26px;height:6px;background:#9f8d85;border:1px solid #0e0e0e;transform:rotate(35deg);"></div>
              <div style="position:absolute;top:6px;right:4px;width:26px;height:6px;background:#9f8d85;border:1px solid #0e0e0e;transform:rotate(-35deg);"></div>
            </div></div>
            <div><h3>Puxar do fogo</h3><p>git rebuild</p></div>
          </button>
          <button class="action-btn" data-action="3">
            <div class="icon-box"><div style="position:relative;width:40px;height:40px;">
              <div style="position:absolute;top:6px;left:2px;width:36px;height:22px;background:#9f8d85;border:2px solid #0e0e0e;clip-path:polygon(10% 0,90% 0,100% 50%,90% 100%,10% 100%,0 50%);box-shadow:inset 2px 2px 0 rgba(255,255,255,.25);"></div>
            </div></div>
            <div><h3>Consultar a forja</h3><p>git log</p></div>
          </button>
        </div>
        <div style="margin-top:4px;background:#0e0e0e;border:4px solid #52443d;padding:16px;position:relative;box-shadow:inset 0 0 10px rgba(0,0,0,.8);">
          <div style="position:absolute;top:-4px;left:-4px;width:8px;height:8px;background:#fbb796;"></div>
          <div style="position:absolute;top:-4px;right:-4px;width:8px;height:8px;background:#fbb796;"></div>
          <div style="position:absolute;bottom:-4px;left:-4px;width:8px;height:8px;background:#fbb796;"></div>
          <div style="position:absolute;bottom:-4px;right:-4px;width:8px;height:8px;background:#fbb796;"></div>
          <p id="dialogue" style="overflow:hidden;white-space:nowrap;font-family:'Fira Sans',sans-serif;font-size:18px;color:#ffe16d;margin:0;">O ferro está pronto para ser moldado...</p>
          <div style="position:absolute;bottom:10px;right:10px;width:10px;height:10px;background:#ffe16d;border-radius:50%;animation:pulseOpacity 1.2s infinite;"></div>
        </div>
        <div class="particles" id="particles">
          <div class="spark" style="width:8px;height:8px;background:#ff8a4c;animation:spark1 .7s ease-out forwards;"></div>
          <div class="spark" style="width:8px;height:8px;background:#ffe16d;animation:spark2 .7s ease-out forwards;"></div>
          <div class="spark" style="width:6px;height:6px;background:#ff8a4c;animation:spark3 .6s ease-out forwards .05s;"></div>
          <div class="spark" style="width:6px;height:6px;background:#ffe16d;animation:spark4 .6s ease-out forwards .05s;"></div>
          <div class="spark" style="width:7px;height:7px;background:#ff636f;animation:spark5 .75s ease-out forwards .1s;"></div>
          <div class="spark" style="width:7px;height:7px;background:#ff636f;animation:spark6 .75s ease-out forwards .1s;"></div>
        </div>
        <div style="display:flex;justify-content:flex-end;gap:16px;">
          <button id="btn-cancel" style="background:#353535;color:#e5e2e1;border:2px solid #52443d;padding:10px 24px;font-family:'Space Mono',monospace;font-size:13px;font-weight:700;text-transform:uppercase;cursor:pointer;box-shadow:4px 4px 0 rgba(0,0,0,.8);">Cancelar</button>
          <button id="btn-confirm" style="background:#c78a6b;color:#4e250d;border:2px solid #fbb796;padding:10px 24px;font-family:'Space Mono',monospace;font-size:13px;font-weight:700;text-transform:uppercase;cursor:pointer;box-shadow:4px 4px 0 rgba(0,0,0,.8);">Confirmar</button>
        </div>
      </div>
    </div>
  </div>

</div>
<script>
  var ACTIONS = [
    { prompt: 'O ferro está pronto para ser moldado...', result: 'Hermes: commit forjado — 3 arquivos temperados no fogo do repositório.' },
    { prompt: 'O fole aviva as chamas...', result: 'Hermes: sincronizado com a origem — 2 commits recebidos, 1 enviado.' },
    { prompt: 'O metal aquece novamente sob as pinças...', result: 'Hermes: rebuild completo — a lâmina saiu mais afiada.' },
    { prompt: 'As marcas do martelo contam a história...', result: 'Hermes: últimos 5 commits exibidos no registro da forja.' }
  ];
  var BUILDING_NAMES = { palace: 'Palácio do Alaafin', grove: 'Bosque de Nanã', market: 'Mercado de Exu' };
  var selected = 0, confirmed = false, toastTimer = null;

  function showScreen(id) {
    document.querySelectorAll('.screen').forEach(function (s) { s.classList.remove('active'); });
    document.getElementById(id).classList.add('active');
  }
  document.getElementById('btn-enter').addEventListener('click', function () { showScreen('screen-map'); });
  document.getElementById('btn-back').addEventListener('click', function () { showScreen('screen-map'); });

  document.querySelectorAll('.marker').forEach(function (m) {
    m.addEventListener('click', function () {
      if (m.dataset.built === '1') { showScreen('screen-forge'); return; }
      var name = BUILDING_NAMES[m.dataset.building];
      var toast = document.getElementById('toast');
      toast.textContent = name + ': em construção nesta rodada';
      toast.style.display = 'block';
      clearTimeout(toastTimer);
      toastTimer = setTimeout(function () { toast.style.display = 'none'; }, 2400);
    });
  });

  function renderDialogue() {
    var p = document.getElementById('dialogue');
    p.style.animation = 'none';
    p.textContent = confirmed ? ACTIONS[selected].result : ACTIONS[selected].prompt;
    requestAnimationFrame(function () { p.style.animation = 'typing 1.6s steps(40,end)'; });
  }
  document.querySelectorAll('.action-btn').forEach(function (btn) {
    btn.addEventListener('click', function () {
      document.querySelectorAll('.action-btn').forEach(function (b) { b.classList.remove('active'); });
      btn.classList.add('active');
      selected = parseInt(btn.dataset.action, 10);
      confirmed = false;
      document.getElementById('particles').classList.remove('show');
      renderDialogue();
    });
  });
  document.getElementById('btn-cancel').addEventListener('click', function () {
    confirmed = false;
    document.getElementById('particles').classList.remove('show');
    renderDialogue();
  });
  document.getElementById('btn-confirm').addEventListener('click', function () {
    confirmed = true;
    renderDialogue();
    var particles = document.getElementById('particles');
    particles.classList.remove('show');
    void particles.offsetWidth;
    particles.classList.add('show');
  });
</script>
</body>
</html>
